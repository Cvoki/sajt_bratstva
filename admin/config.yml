backend:
  name: git-gateway
  branch: main

media_folder: "slike"
public_folder: "/slike"

publish_mode: simple

collections:
  - name: "vesti"
    label: "Вести"
    label_singular: "Вест"
    folder: "content/vesti"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { label: "Наслов", name: "title", widget: "string" }
      - { label: "Датум", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss.SSSZ", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - label: "Категорија"
        name: "category"
        widget: "select"
        required: false
        options: ["Слава", "Помен", "Окупљање", "Обавештење"]
      - { label: "Слика", name: "image", widget: "image", required: false }
      - { label: "Опис слике", name: "caption", widget: "string", required: false }
      - { label: "Текст", name: "body", widget: "markdown" }
      - { label: "Нацрт (не приказуј на сајту док је укључено)", name: "draft", widget: "boolean", default: true }

  - name: "galerija"
    label: "Галерија"
    label_singular: "Фотографија"
    folder: "content/galerija"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: caption
    summary: "{{caption}}"
    fields:
      - { label: "Фотографија", name: "image", widget: "image" }
      - { label: "Опис", name: "caption", widget: "string" }
      - { label: "Датум", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Редни број (мањи број иде раније; остави празно за ређање по датуму)", name: "order", widget: "number", required: false, value_type: "int" }
      - { label: "Сакриј са сајта", name: "draft", widget: "boolean", default: false, required: false }
